name: AI Shorts Post (Aquatic EN)

on:
  workflow_dispatch:

jobs:
  post_shorts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f season02_aquatic/requirements.txt ]; then pip install -r season02_aquatic/requirements.txt; fi

      - name: Run automated production
        env:
          # パターン1: アンダーバー（通常）
          CLIENT_ID_AQUATIC_EN: ${{ secrets.CLIENT_ID_AQUATIC_EN }}
          CLIENT_SECRET_AQUATIC_EN: ${{ secrets.CLIENT_SECRET_AQUATIC_EN }}
          REFRESH_TOKEN_AQUATIC_EN: ${{ secrets.REFRESH_TOKEN_AQUATIC_EN }}
          GEMINI_API_KEY_AQUATIC_EN: ${{ secrets.GEMINI_API_KEY_AQUATIC_EN }}
          PEXELS_API_KEY_AQUATIC_EN: ${{ secrets.PEXELS_API_KEY_AQUATIC_EN }}

          # パターン2: ハイフン
          CLIENT_ID_AQUATIC_MINUS_EN: ${{ secrets.CLIENT_ID_AQUATIC_EN }}
          CLIENT_SECRET_AQUATIC_MINUS_EN: ${{ secrets.CLIENT_SECRET_AQUATIC_EN }}
          REFRESH_TOKEN_AQUATIC_MINUS_EN: ${{ secrets.REFRESH_TOKEN_AQUATIC_EN }}

          # パターン3: 結合型
          CLIENT_ID_AQUATICEN: ${{ secrets.CLIENT_ID_AQUATIC_EN }}
          CLIENT_SECRET_AQUATICEN: ${{ secrets.CLIENT_SECRET_AQUATIC_EN }}
          REFRESH_TOKEN_AQUATICEN: ${{ secrets.REFRESH_TOKEN_AQUATIC_EN }}

          # パターン4: プレフィックスなし（直渡し）
          CLIENT_ID: ${{ secrets.CLIENT_ID_AQUATIC_EN }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET_AQUATIC_EN }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN_AQUATIC_EN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_AQUATIC_EN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY_AQUATIC_EN }}
        run: |
          echo "【English Aquatic Channel - AquaCurious】Starting automated production..."
          cd season02_aquatic
          python common_src/auto_main.py
