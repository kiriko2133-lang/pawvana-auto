name: AI Shorts Post (Aquatic EN)

on:
  workflow_dispatch:

jobs:
  post_shorts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f season02_aquatic/requirements.txt ]; then pip install -r season02_aquatic/requirements.txt; fi

      - name: Run automated production
        env:
          # パターンA: フォルダ名「season02_aquatic」から自動生成される環境変数名に対応
          SEASON02_AQUATIC_CLIENT_ID: ${{ secrets.CLIENT_ID_AQUATIC_EN }}
          SEASON02_AQUATIC_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET_AQUATIC_EN }}
          SEASON02_AQUATIC_REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN_AQUATIC_EN }}

          # パターンB: プロファイル名「aquatic_en」から生成される環境変数名に対応
          AQUATIC_EN_CLIENT_ID: ${{ secrets.CLIENT_ID_AQUATIC_EN }}
          AQUATIC_EN_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET_AQUATIC_EN }}
          AQUATIC_EN_REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN_AQUATIC_EN }}

          # パターンC: プロファイル名無しの標準環境変数（予備ルートを100%通すため）
          CLIENT_ID: ${{ secrets.CLIENT_ID_AQUATIC_EN }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET_AQUATIC_EN }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN_AQUATIC_EN }}

          # 共通APIキー
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_AQUATIC_EN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY_AQUATIC_EN }}
          GEMINI_API_KEY_AQUATIC_EN: ${{ secrets.GEMINI_API_KEY_AQUATIC_EN }}
          PEXELS_API_KEY_AQUATIC_EN: ${{ secrets.PEXELS_API_KEY_AQUATIC_EN }}
          GEMINI_API_KEY_SEASON02_AQUATIC: ${{ secrets.GEMINI_API_KEY_AQUATIC_EN }}
          
        run: |
          echo "【English Aquatic Channel - AquaCurious】Starting automated production..."
          cd season02_aquatic
          python common_src/auto_main.py .
