name: AI Shorts Post (Aquatic EN)

on:
  workflow_dispatch:

jobs:
  post_shorts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f season02_aquatic/requirements.txt ]; then pip install -r season02_aquatic/requirements.txt; fi

      - name: Run automated production
        env:
          # GitHub上のSecrets（末尾がAQUATIC_ENのもの）を、
          # プログラムの内部ロジックで発生しうる「すべての名前パターン」にマッピングして同時に渡します。
          
          # パターン1: 完全素の名前（引数無視パターン）
          CLIENT_ID: ${{ secrets.CLIENT_ID_AQUATIC_EN }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET_AQUATIC_EN }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN_AQUATIC_EN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_AQUATIC_EN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY_AQUATIC_EN }}

          # パターン2: 先頭大文字（レポート指摘パターン）
          AQUATIC_EN_CLIENT_ID: ${{ secrets.CLIENT_ID_AQUATIC_EN }}
          AQUATIC_EN_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET_AQUATIC_EN }}
          AQUATIC_EN_REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN_AQUATIC_EN }}
          AQUATIC_EN_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_AQUATIC_EN }}
          AQUATIC_EN_PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY_AQUATIC_EN }}

          # パターン3: 末尾大文字パターン
          CLIENT_ID_AQUATIC_EN: ${{ secrets.CLIENT_ID_AQUATIC_EN }}
          CLIENT_SECRET_AQUATIC_EN: ${{ secrets.CLIENT_SECRET_AQUATIC_EN }}
          REFRESH_TOKEN_AQUATIC_EN: ${{ secrets.REFRESH_TOKEN_AQUATIC_EN }}

          # パターン4: 小文字そのままパターン
          aquatic_en_CLIENT_ID: ${{ secrets.CLIENT_ID_AQUATIC_EN }}
          aquatic_en_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET_AQUATIC_EN }}
          aquatic_en_REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN_AQUATIC_EN }}

          # パターン5: アンダーバーなし結合パターン
          AQUATICEN_CLIENT_ID: ${{ secrets.CLIENT_ID_AQUATIC_EN }}
          AQUATICEN_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET_AQUATIC_EN }}
          AQUATICEN_REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN_AQUATIC_EN }}
          
        run: |
          echo "【English Aquatic Channel - AquaCurious】Starting automated production..."
          cd season02_aquatic
          python common_src/auto_main.py
