name: AI Shorts Post (Aquatic EN)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '30 22 * * *'  # 日本時間 朝 7:30
    - cron: '30 6 * * *'   # 日本時間 昼 15:30 (追加)
    - cron: '30 10 * * *'  # 日本時間 夜 21:30
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg fonts-liberation fonts-noto-color-emoji

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f season02_aquatic/requirements.txt ]; then
          pip install -r season02_aquatic/requirements.txt
        else
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2
        fi
        pip install --upgrade edge-tts

    - name: Run Auto Post
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_AQUATIC_EN }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY_AQUATIC_EN }}

        # 分離されたこのリポジトリのSecretsから直接読み込み（プログラムの要求する変数名にマッピング）
        YOUTUBE_CLIENT_ID_SEASON02_AQUATIC: ${{ secrets.CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET_SEASON02_AQUATIC: ${{ secrets.CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN_SEASON02_AQUATIC: ${{ secrets.REFRESH_TOKEN }}

        GITHUB_ACTIONS: "true"
        PYTHONUNBUFFERED: "1"
      run: |
        echo "【English Aquatic Channel - AquaCurious】Starting automated production..."
        python season02_aquatic/common_src/auto_main.py season02_aquatic
