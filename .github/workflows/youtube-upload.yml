name: AI Shorts Post (Aquatic EN)

on:
  workflow_dispatch:

jobs:
  post_shorts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f season02_aquatic/requirements.txt ]; then
            pip install -r season02_aquatic/requirements.txt
          fi

      - name: Run automated production
        working-directory: season02_aquatic
        env:
          # ✅ main.py が os.environ.get("YOUTUBE_CLIENT_ID_AQUATIC_EN") で読む名前
          YOUTUBE_CLIENT_ID_AQUATIC_EN:     ${{ secrets.CLIENT_ID_AQUATIC_EN }}
          YOUTUBE_CLIENT_SECRET_AQUATIC_EN: ${{ secrets.CLIENT_SECRET_AQUATIC_EN }}
          YOUTUBE_REFRESH_TOKEN_AQUATIC_EN: ${{ secrets.REFRESH_TOKEN_AQUATIC_EN }}

          # その他のAPIキー
          GEMINI_API_KEY:          ${{ secrets.GEMINI_API_KEY_AQUATIC_EN }}
          PEXELS_API_KEY:          ${{ secrets.PEXELS_API_KEY_AQUATIC_EN }}
          GEMINI_API_KEY_AQUATIC_EN:  ${{ secrets.GEMINI_API_KEY_AQUATIC_EN }}
          PEXELS_API_KEY_AQUATIC_EN:  ${{ secrets.PEXELS_API_KEY_AQUATIC_EN }}

          # GitHub Actions 判定フラグ（main.py内のブラウザ認証回避に必要）
          GITHUB_ACTIONS: "true"

        run: |
          echo "【English Aquatic Channel - AquaCurious】Starting automated production..."
          touch .env
          # ✅ profile_key "aquatic_en" を引数で明示的に渡す
          python common_src/auto_main.py aquatic_en
