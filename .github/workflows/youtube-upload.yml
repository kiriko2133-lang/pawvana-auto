name: AI Shorts Post (Aquatic EN)

on:
  workflow_dispatch:

jobs:
  post_shorts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f season02_aquatic/requirements.txt ]; then pip install -r season02_aquatic/requirements.txt; fi

      - name: Run automated production
        run: |
          # 1. 最初にプログラムが存在する正しいディレクトリへ移動します
          cd season02_aquatic
          
          # 2. 移動後の環境（シェル）に対して変数を注入します
          export aquatic_en_CLIENT_ID="${{ secrets.CLIENT_ID_AQUATIC_EN }}"
          export aquatic_en_CLIENT_SECRET="${{ secrets.CLIENT_SECRET_AQUATIC_EN }}"
          export aquatic_en_REFRESH_TOKEN="${{ secrets.REFRESH_TOKEN_AQUATIC_EN }}"
          
          export AQUATIC_EN_CLIENT_ID="${{ secrets.CLIENT_ID_AQUATIC_EN }}"
          export AQUATIC_EN_CLIENT_SECRET="${{ secrets.CLIENT_SECRET_AQUATIC_EN }}"
          export AQUATIC_EN_REFRESH_TOKEN="${{ secrets.REFRESH_TOKEN_AQUATIC_EN }}"
          
          export CLIENT_ID="${{ secrets.CLIENT_ID_AQUATIC_EN }}"
          export CLIENT_SECRET="${{ secrets.CLIENT_SECRET_AQUATIC_EN }}"
          export REFRESH_TOKEN="${{ secrets.REFRESH_TOKEN_AQUATIC_EN }}"
          
          export GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY_AQUATIC_EN }}"
          export PEXELS_API_KEY="${{ secrets.PEXELS_API_KEY_AQUATIC_EN }}"
          export GEMINI_API_KEY_AQUATIC_EN="${{ secrets.GEMINI_API_KEY_AQUATIC_EN }}"
          export PEXELS_API_KEY_AQUATIC_EN="${{ secrets.PEXELS_API_KEY_AQUATIC_EN }}"
          
          echo "【English Aquatic Channel - AquaCurious】Starting automated production..."
          
          # 3. 認証の競合を防ぐため、移動先にも空の .env を作成
          touch .env
          
          # 4. 同一階層からプログラムを実行
          python common_src/auto_main.py
